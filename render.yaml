services:
  - type: web
    name: gfc-admin
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: FACEBOOK_GRAPH_VERSION
        value: v26.0
      - key: FACEBOOK_GFC_PAGE_ID
        sync: false
      - key: FACEBOOK_GFC_PAGE_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_NEXTGEN_PAGE_ID
        sync: false
      - key: FACEBOOK_NEXTGEN_PAGE_ACCESS_TOKEN
        sync: false
